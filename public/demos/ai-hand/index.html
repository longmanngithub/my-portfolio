<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hand Interaction Demo</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020202; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #input-video { position: absolute; top: 0; left: 0; opacity: 0; pointer-events: none; z-index: 0; }
        
        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            background: rgba(0, 255, 255, 0.15);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff;
            padding: 16px 32px;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 600;
            text-align: center;
            line-height: 1.6;
        }
        #start-btn:hover {
            background: rgba(0, 255, 255, 0.3);
            border-color: rgba(0,255,255,0.7);
            color: #fff;
            transform: translate(-50%, -50%) translateY(-2px);
            box-shadow: 0 0 25px rgba(0,255,255,0.4);
        }
        #start-btn .subtitle {
            display: block;
            font-size: 10px;
            letter-spacing: 1px;
            opacity: 0.7;
            margin-top: 6px;
            text-transform: none;
        }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8); z-index: 200; pointer-events: none; text-align: center;
            font-weight: 300; letter-spacing: 1px; font-size: 13px;
            background: rgba(0,0,0,0.8); padding: 20px; border-radius: 8px;
            border: 1px solid rgba(0,255,255,0.2);
            display: none;
        }
        .loader-spinner {
            width: 36px; height: 36px; border: 3px solid rgba(0,255,255,0.2);
            border-top: 3px solid #00ffff; border-radius: 50%; margin: 0 auto 12px auto;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #gesture-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            letter-spacing: 1px;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        /* Make lil-gui more compact for iframe */
        .lil-gui { --width: 200px; font-size: 11px !important; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <button id="start-btn">
        🖐 Start Hand Tracking
        <span class="subtitle">Requires camera access</span>
    </button>

    <div id="loading">
        <div class="loader-spinner"></div>
        Initializing AI Vision Engine...<br>Please allow camera access.
    </div>

    <div id="gesture-hint"></div>
    
    <video id="input-video" playsinline></video>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'; 
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
        import GUI from 'lil-gui';

        let scene, camera, renderer, particles, geometry, material;
        let controls, composer, afterimagePass, bloomPass; 
        
        const particleCount = 1000; 
        const posArray = new Float32Array(particleCount * 3);
        const targetArray = new Float32Array(particleCount * 3);
        
        let handInteraction = {
            active: false,
            pinchDistance: 1.0,
            smoothPinch: 1.0
        };

        const params = {
            shape: 'Heart',
            color: '#00ffff', 
            particleSize: 0.15,
            interactionStrength: 2.5,
            trailStrength: 0.60, 
            bloomStrength: 0.5,
            bloomRadius: 0.4,
            bloomThreshold: 0.3
        };

        function initThree() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.03);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = 30;
            camera.position.y = 5;

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.setClearColor(0x000000);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            container.appendChild(renderer.domElement);

            composer = new EffectComposer(renderer);
            
            const renderPass = new RenderPass(scene, camera);
            composer.addPass(renderPass);

            afterimagePass = new AfterimagePass();
            afterimagePass.uniforms['damp'].value = params.trailStrength;
            composer.addPass(afterimagePass);

            bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                params.bloomStrength,
                params.bloomRadius,
                params.bloomThreshold
            );
            composer.addPass(bloomPass);

            const outputPass = new OutputPass();
            composer.addPass(outputPass);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.8;
            controls.enablePan = false;

            const sprite = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/disc.png');
            material = new THREE.PointsMaterial({
                size: params.particleSize,
                color: params.color,
                map: sprite,
                transparent: true,
                opacity: 1.0, 
                blending: THREE.AdditiveBlending, 
                depthWrite: false
            });

            geometry = new THREE.BufferGeometry();
            
            calculateShape('Heart');
            
            for(let i=0; i<particleCount*3; i++) {
                posArray[i] = targetArray[i];
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            window.addEventListener('resize', onWindowResize);
        }

        function calculateShape(type) {
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                let x, y, z;

                if (type === 'Heart') {
                    const t = Math.random() * Math.PI * 2;
                    const thick = (Math.random() - 0.5) * 5;
                    x = 16 * Math.pow(Math.sin(t), 3);
                    y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                    z = thick;
                    x *= 0.5; y *= 0.5;

                } else if (type === 'Saturn') {
                    const r = 9;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                    if (i % 3 === 0) {
                         const angle = Math.random() * Math.PI * 2;
                         const dist = 13 + Math.random() * 6;
                         x = Math.cos(angle) * dist;
                         z = Math.sin(angle) * dist;
                         y = (Math.random() - 0.5) * 0.4;
                         const tilt = Math.PI / 6;
                         const x_new = x * Math.cos(tilt) - y * Math.sin(tilt);
                         const y_new = x * Math.sin(tilt) + y * Math.cos(tilt);
                         x = x_new; y = y_new;
                    }

                } else if (type === 'Flower') {
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * Math.PI;
                    const r = 10 * Math.sin(3 * u) * Math.sin(v); 
                    x = r * Math.sin(u) * Math.cos(v);
                    y = r * Math.sin(u) * Math.sin(v);
                    z = r * Math.cos(u);

                } else if (type === 'Buddha') {
                    const r_idx = Math.random();
                    if (r_idx < 0.15) { 
                        const r = 2.5;
                        const u = Math.random() * Math.PI * 2;
                        const v = Math.random() * Math.PI;
                        x = r * Math.sin(v) * Math.cos(u);
                        y = r * Math.sin(v) * Math.sin(u) + 6.5; 
                        z = r * Math.cos(v);
                    } else if (r_idx < 0.55) {
                        const r = 4.8;
                        const u = Math.random() * Math.PI * 2;
                        const v = Math.random() * Math.PI;
                        x = r * 1.2 * Math.sin(v) * Math.cos(u);
                        y = r * Math.sin(v) * Math.sin(u);
                        z = r * 0.8 * Math.cos(v);
                    } else {
                        const r = 6 + Math.random() * 3;
                        const u = Math.random() * Math.PI * 2;
                        x = r * Math.cos(u);
                        z = r * Math.sin(u);
                        y = -4 + (Math.random() * 2.5); 
                    }

                } else if (type === 'Firework') {
                    const r = Math.random() * 18;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.random() * Math.PI;
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                }

                targetArray[i3] = x;
                targetArray[i3 + 1] = y;
                targetArray[i3 + 2] = z;
            }
        }

        function initGUI() {
            const gui = new GUI({ title: 'Controls' });
            
            gui.add(params, 'shape', ['Heart', 'Saturn', 'Flower', 'Buddha', 'Firework']).name('Shape').onChange(val => calculateShape(val));
            gui.addColor(params, 'color').name('Color').onChange(val => material.color.set(val));
            gui.add(params, 'particleSize', 0.01, 0.5).name('Size').onChange(val => material.size = val);
            gui.add(params, 'interactionStrength', 0, 5).name('Gesture Power');

            const vfxFolder = gui.addFolder('VFX');
            vfxFolder.add(params, 'trailStrength', 0.5, 0.99).name('Trails').onChange(val => afterimagePass.uniforms['damp'].value = val);
            vfxFolder.add(params, 'bloomStrength', 0, 3).name('Glow').onChange(val => bloomPass.strength = val);
            vfxFolder.add(params, 'bloomRadius', 0, 1).name('Radius').onChange(val => bloomPass.radius = val);
            vfxFolder.open();
        }

        function animate() {
            requestAnimationFrame(animate);

            let targetPinch = handInteraction.active ? handInteraction.pinchDistance : 1.0;
            handInteraction.smoothPinch += (targetPinch - handInteraction.smoothPinch) * 0.1;

            const positions = geometry.attributes.position.array;
            const explosionFactor = Math.max(0, (handInteraction.smoothPinch - 0.75) * params.interactionStrength * 6); 
            const time = Date.now() * 0.001;

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const tx = targetArray[i3];
                const ty = targetArray[i3+1];
                const tz = targetArray[i3+2];

                let scale = 1.0;
                if(handInteraction.smoothPinch < 0.5) {
                    scale = 0.5 + handInteraction.smoothPinch; 
                } else if (handInteraction.smoothPinch > 0.8) {
                    scale = 1.0 + (handInteraction.smoothPinch - 0.8) * 0.5;
                }

                positions[i3]     += (tx * scale - positions[i3]) * 0.05;
                positions[i3 + 1] += (ty * scale - positions[i3 + 1]) * 0.05;
                positions[i3 + 2] += (tz * scale - positions[i3 + 2]) * 0.05;

                if (explosionFactor > 0.1) {
                    positions[i3]   += (Math.random() - 0.5) * explosionFactor;
                    positions[i3+1] += (Math.random() - 0.5) * explosionFactor;
                    positions[i3+2] += (Math.random() - 0.5) * explosionFactor;
                }
            }

            geometry.attributes.position.needsUpdate = true;
            particles.rotation.y = time * 0.02;
            particles.rotation.z = Math.sin(time * 0.1) * 0.02;
            controls.update();
            composer.render();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            bloomPass.resolution.set(window.innerWidth, window.innerHeight);
        }

        async function initMediaPipe() {
            const videoElement = document.getElementById('input-video');

            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 0, 
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandsResults);

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 640,
                height: 480
            });

            cameraUtils.start()
                .then(() => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('gesture-hint').textContent = '🖐 Pinch to contract • Open hand to explode • Idle to drift';
                    setTimeout(() => {
                        document.getElementById('gesture-hint').style.opacity = '0';
                    }, 6000);
                })
                .catch(err => {
                    document.getElementById('loading').innerHTML = "Camera Access Denied<br>Please use HTTPS or Localhost";
                    console.error(err);
                });
        }

        function onHandsResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handInteraction.active = true;
                const landmarks = results.multiHandLandmarks[0];
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const distance = Math.sqrt(
                    Math.pow(thumbTip.x - indexTip.x, 2) +
                    Math.pow(thumbTip.y - indexTip.y, 2)
                );
                const val = Math.min(Math.max((distance - 0.02) / 0.15, 0), 1);
                handInteraction.pinchDistance = val;
            } else {
                handInteraction.active = false;
            }
        }

        // Initialize Three.js immediately (particles visible without camera)
        initThree();
        initGUI();
        animate();

        // Start camera only on button click
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            initMediaPipe();
        });
    </script>
</body>
</html>
