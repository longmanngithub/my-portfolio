name: Deploy Portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_LOGIN: ${{ secrets.GH_LOGIN }}
        run: pnpm build

      - name: Deploy (optional - add your deployment step here)
        run: echo "Add your deployment command here"
